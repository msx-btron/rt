# rt — multi-arch kernel CI
# Native x86_64, QEMU user-mode for IA-32 and AArch64, QEMU virt for RVV.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CFLAGS: -std=c99 -O2 -Wall -Wextra -Werror -fno-strict-aliasing -fno-builtin

jobs:
  # ------------------------------------------------------------------
  # Host oracle: scalar + SSE2 + AVX + AVX2 + AVX-512 (CPU-probed)
  # ------------------------------------------------------------------
  x86_64-native:
    name: EM64T SSE2/AVX/AVX2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host oracle
        run: |
          set -eux
          cc $CFLAGS -Iinclude -o /tmp/test_host verify/suite/test_host.c \
            src/common/scalar/mem.c src/common/scalar/string.c \
            src/common/scalar/stdlib.c src/common/scalar/stdio.c \
            src/x86_64/sse2/mem.s src/x86_64/avx/mem.s \
            src/x86_64/avx2/mem.s src/x86_64/avx512/mem.s
          NO_COLOR=1 TERM=dumb /tmp/test_host > /tmp/oracle.txt
          cat /tmp/oracle.txt
          grep -q '== backend: sse2 ==' /tmp/oracle.txt
          grep -q '== backend: avx ==' /tmp/oracle.txt
          grep -q '== backend: avx2 ==' /tmp/oracle.txt
          if grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; then
            grep -q '== backend: avx512 ==' /tmp/oracle.txt
          else
            echo "host CPU has no AVX-512; the avx512 table stays off"
          fi

  # ------------------------------------------------------------------
  # i386 ladder under qemu-i386: 386 / MMX / SSE (+ assemble PC-98)
  # ------------------------------------------------------------------
  i386-qemu:
    name: IA-32 REP/MMX/SSE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install multilib + qemu-user
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-multilib qemu-user
      - name: Build static i386 oracle
        run: |
          set -eux
          cc $CFLAGS -m32 -static -Iinclude -o /tmp/test_host32 verify/suite/test_host.c \
            src/common/scalar/mem.c src/common/scalar/string.c \
            src/common/scalar/stdlib.c src/common/scalar/stdio.c \
            src/i386/rep/mem.s src/i386/mmx/mem.s src/i386/sse/mem.s
      - name: QEMU pentium2 (scalar+i386+mmx)
        run: qemu-i386 -cpu pentium2 /tmp/test_host32
      - name: QEMU pentium3 (scalar+i386+mmx+sse)
        run: qemu-i386 -cpu pentium3 /tmp/test_host32
      - name: Assemble PC-98 kernels
        run: |
          set -eux
          cc -m32 -c -o /tmp/pc98.o src/i386/pc98/mem.s
          cc -m32 -c -o /tmp/pc98_16.o src/i386/pc98/mem16.s
          echo "pc98 asm ok"

  # ------------------------------------------------------------------
  # AArch64 NEON under qemu-aarch64
  # ------------------------------------------------------------------
  aarch64-neon-qemu:
    name: AArch64 NEON
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross + qemu
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-aarch64-linux-gnu qemu-user
      - name: Build + run NEON oracle
        run: |
          set -eux
          aarch64-linux-gnu-gcc $CFLAGS -static -Iinclude \
            -o /tmp/test_host_a64 verify/suite/test_host.c \
            src/common/scalar/mem.c src/common/scalar/string.c \
            src/common/scalar/stdlib.c src/common/scalar/stdio.c \
            src/aarch64/neon/mem.S src/aarch64/neon/string.S
          qemu-aarch64 /tmp/test_host_a64

  # ------------------------------------------------------------------
  # AArch64 SVE assemble + link smoke (runtime optional)
  # ------------------------------------------------------------------
  aarch64-sve:
    name: AArch64 SVE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-aarch64-linux-gnu qemu-user binutils-aarch64-linux-gnu
      - name: Assemble SVE kernel
        run: |
          set -eux
          aarch64-linux-gnu-gcc -c -o /tmp/sve.o src/aarch64/sve/mem.s
          aarch64-linux-gnu-nm /tmp/sve.o | grep -E 'rt_memcpy_sve|rt_memset_sve|rt_memcmp_sve' || true
          echo "sve asm ok"
      - name: SVE runtime smoke (best-effort)
        run: |
          set -eux
          # Link a tiny main that only calls memcpy_sve if symbols exist
          cat > /tmp/sve_smoke.c << 'C'
          #include <stddef.h>
          #include <stdio.h>
          void *rt_memcpy_sve(void *d, const void *s, size_t n);
          void *rt_memset_sve(void *d, int c, size_t n);
          int main(void) {
            unsigned char a[64], b[64];
            int i;
            for (i = 0; i < 64; i++) b[i] = (unsigned char)i;
            rt_memset_sve(a, 0, 64);
            rt_memcpy_sve(a, b, 64);
            for (i = 0; i < 64; i++) if (a[i] != b[i]) return 1;
            puts("sve smoke ok");
            return 0;
          }
          C
          aarch64-linux-gnu-gcc $CFLAGS -static -o /tmp/sve_smoke /tmp/sve_smoke.c \
            src/aarch64/sve/mem.s || { echo "sve link skipped"; exit 0; }
          # QEMU may or may not emulate SVE on this runner image
          qemu-aarch64 -cpu max /tmp/sve_smoke || \
            qemu-aarch64 /tmp/sve_smoke || \
            echo "sve runtime not available on this QEMU (asm still verified)"

  # ------------------------------------------------------------------
  # Two guests, same script as `make riscv`. Each job is one XLEN:
  # freestanding contract, then scalar off, scalar on, and RVV.
  # ------------------------------------------------------------------
  riscv-rvv32:
    name: RISC-V RVV32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld, and QEMU system
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang lld qemu-system-misc curl python3 cpio gzip
      - name: RISC-V RVV32
        run: sh scripts/riscv.sh 32

  riscv-rvv64:
    name: RISC-V RVV64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld, and QEMU system
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang lld qemu-system-misc curl python3 cpio gzip
      - name: RISC-V RVV64
        run: sh scripts/riscv.sh 64

  # ------------------------------------------------------------------
  # SQCSA Test Suite — `make security` must come back clean
  # ------------------------------------------------------------------
  sqcsa:
    name: SQCSA Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install scanners
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang cppcheck flawfinder python3
      - name: make security
        run: make security

  # ------------------------------------------------------------------
  # Coq check. Ubuntu 24.04's apt package coq is 8.18 and has no
  # `From Stdlib`. The image is Rocq 9.2, the same line as local coqc.
  # ------------------------------------------------------------------
  verify:
    name: Coq verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisite — Rocq 9.2
        run: |
          set -eux
          docker pull rocq/rocq-prover:9.2
          # Image entrypoint is `opam exec --`. It ships `rocq compile`,
          # not the `coqc` compatibility shim.
          docker run --rm rocq/rocq-prover:9.2 rocq compile -v
      - name: make verify
        run: |
          set -eux
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            rocq/rocq-prover:9.2 \
            make verify

  # ------------------------------------------------------------------
  # Matrix summary job (always runs)
  # ------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    needs:
      - x86_64-native
      - i386-qemu
      - aarch64-neon-qemu
      - aarch64-sve
      - riscv-rvv32
      - riscv-rvv64
      - sqcsa
      - verify
    if: always()
    steps:
      - name: Results
        run: |
          echo "x86_64-native:      ${{ needs.x86_64-native.result }}"
          echo "i386-qemu:          ${{ needs.i386-qemu.result }}"
          echo "aarch64-neon-qemu:  ${{ needs.aarch64-neon-qemu.result }}"
          echo "aarch64-sve:        ${{ needs.aarch64-sve.result }}"
          echo "riscv-rvv32:        ${{ needs.riscv-rvv32.result }}"
          echo "riscv-rvv64:        ${{ needs.riscv-rvv64.result }}"
          echo "sqcsa:              ${{ needs.sqcsa.result }}"
          echo "verify:             ${{ needs.verify.result }}"
          # Fail the workflow if any required job failed
          for r in \
            "${{ needs.x86_64-native.result }}" \
            "${{ needs.i386-qemu.result }}" \
            "${{ needs.aarch64-neon-qemu.result }}" \
            "${{ needs.aarch64-sve.result }}" \
            "${{ needs.riscv-rvv32.result }}" \
            "${{ needs.riscv-rvv64.result }}" \
            "${{ needs.sqcsa.result }}" \
            "${{ needs.verify.result }}"
          do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
